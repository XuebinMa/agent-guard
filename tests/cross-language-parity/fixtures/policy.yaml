version: 1
# Trusted scenarios below use explicit tool modes. Omitting trust leaves the
# caller Untrusted, which ignores tool-level elevation and remains read-only.
default_mode: read_only

tools:
  bash:
    mode: workspace_write
    deny:
      - prefix: "rm -rf"
      - prefix: "sudo"
      - regex: "curl\\s+.*\\|\\s*bash"
      - regex: "^git push --(force|force-with-lease|mirror|delete)$"
    ask:
      - prefix: "git push"
    allow:
      - prefix: "echo"
      - prefix: "ls"
      - prefix: "cat"
      - prefix: "cargo"

  write_file:
    mode: workspace_write
    workspace_escape_paths:
      - "/r7-parity/external*"
    deny_paths:
      - "/etc/**"
      - "**/.ssh/**"

  read_file:
    mode: workspace_write
    allow_paths:
      - "/workspace/**"
      - "/r7-parity/src*"
    deny_paths:
      - ".env*"
      - "/etc/shadow"
      - "/etc/passwd"
      - "**/.ssh/id_*"

  http_request:
    mode: workspace_write
    deny:
      - regex: "^https?://169\\.254\\.169\\.254"
      # Method-aware rule (issue #39): DELETE to the internal API is denied,
      # while GET to the same host stays allowed.
      - regex: "^https?://api\\.internal\\.test/"
        method: DELETE

anomaly:
  enabled: false

audit:
  enabled: false
