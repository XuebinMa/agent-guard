[package]
name = "agent-guard-broker"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
description = "Broker-owned Git push: resolve, authorize and execute the exact outbound transaction"
# Not published: this crate has no user-facing surface yet. It resolves and
# compares transactions and cannot push, so releasing it would put a name on
# a registry ahead of anything anyone could use. Flip this when the broker
# has an entry point.
publish = false

[dependencies]
agent-guard-core = { path = "../agent-guard-core", version = "=0.2.1" }
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
hex.workspace = true
thiserror.workspace = true

[dev-dependencies]
tempfile = "3"
